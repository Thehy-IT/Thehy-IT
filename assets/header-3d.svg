<svg width="1200" height="240" viewBox="0 0 1200 240" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E3A5F"/>
      <stop offset="100%" stop-color="#0B1220"/>
    </linearGradient>

    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="45%" stop-color="#E0F2FE"/>
      <stop offset="55%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.6 0;0.6 0;-0.6 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowStrong" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- base background -->
  <rect width="1200" height="240" fill="url(#bgGrad)"/>

  <!-- faint grid for depth -->
  <g stroke="#1E3A5F" stroke-width="1" opacity="0.35">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="200" y1="0" x2="200" y2="240"/>
    <line x1="1000" y1="0" x2="1000" y2="240"/>
  </g>

  <!-- moving scan light -->
  <rect x="-300" y="0" width="300" height="240" fill="url(#scanGrad)">
    <animateTransform attributeName="transform" type="translate" values="0,0;1500,0;0,0" dur="9s" repeatCount="indefinite"/>
  </rect>

  <!-- floating mathematical symbols, continuous motion -->
  <g font-family="Georgia, 'Cambria Math', serif" fill="#38BDF8">
    <text x="70" y="52" font-size="40" opacity="0.30" filter="url(#glow)">&#8721;
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-16; 0,0" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.18;0.42;0.18" dur="7s" repeatCount="indefinite"/>
    </text>
    <text x="150" y="115" font-size="30" opacity="0.22" filter="url(#glow)">&#960;
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,12; 0,0" dur="9s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.14;0.32;0.14" dur="9s" begin="1s" repeatCount="indefinite"/>
    </text>
    <text x="60" y="195" font-size="34" opacity="0.26" filter="url(#glow)">&#8734;
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-10; 0,0" dur="6s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.15;0.36;0.15" dur="6s" begin="0.5s" repeatCount="indefinite"/>
    </text>
    <text x="180" y="205" font-size="26" opacity="0.20" filter="url(#glow)">&#8747;
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,10; 0,0" dur="8s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.12;0.30;0.12" dur="8s" begin="2s" repeatCount="indefinite"/>
    </text>

    <text x="1130" y="55" font-size="38" opacity="0.28" filter="url(#glow)">&#916;
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,14; 0,0" dur="7.5s" begin="0.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.16;0.38;0.16" dur="7.5s" begin="0.8s" repeatCount="indefinite"/>
    </text>
    <text x="1050" y="110" font-size="28" opacity="0.22" filter="url(#glow)">&#955;
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-12; 0,0" dur="8.5s" begin="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.13;0.30;0.13" dur="8.5s" begin="1.6s" repeatCount="indefinite"/>
    </text>
    <text x="1140" y="195" font-size="32" opacity="0.24" filter="url(#glow)">&#8730;
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-10; 0,0" dur="6.5s" begin="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.14;0.34;0.14" dur="6.5s" begin="1.2s" repeatCount="indefinite"/>
    </text>
    <text x="1030" y="205" font-size="24" opacity="0.20" filter="url(#glow)">&#952;
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,9; 0,0" dur="9.5s" begin="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.12;0.28;0.12" dur="9.5s" begin="2.4s" repeatCount="indefinite"/>
    </text>

    <text x="330" y="45" font-size="20" opacity="0.10" filter="url(#glow)">&#8711;
      <animate attributeName="opacity" values="0.06;0.18;0.06" dur="10s" repeatCount="indefinite"/>
    </text>
    <text x="870" y="45" font-size="20" opacity="0.10" filter="url(#glow)">&#956;
      <animate attributeName="opacity" values="0.06;0.18;0.06" dur="11s" begin="1s" repeatCount="indefinite"/>
    </text>
    <text x="330" y="215" font-size="20" opacity="0.10" filter="url(#glow)">&#963;
      <animate attributeName="opacity" values="0.06;0.18;0.06" dur="9s" begin="2s" repeatCount="indefinite"/>
    </text>
    <text x="870" y="215" font-size="20" opacity="0.10" filter="url(#glow)">&#8776;
      <animate attributeName="opacity" values="0.06;0.18;0.06" dur="10.5s" begin="0.5s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- 3D extruded title: layered offset copies create depth, top layer glows -->
  <g text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="800">
    <text x="602" y="103" font-size="56" fill="#0B1220" opacity="0.55">HUỲNH THẾ HY</text>
    <text x="600" y="101" font-size="56" fill="#0F172A" opacity="0.75">HUỲNH THẾ HY</text>
    <text x="598" y="99" font-size="56" fill="#1E3A5F">HUỲNH THẾ HY</text>
    <text x="600" y="100" font-size="56" fill="url(#textGrad)" filter="url(#glowStrong)">HUỲNH THẾ HY</text>
  </g>

  <text x="600" y="140" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="17" fill="#94C4E8" letter-spacing="0.5">
    Data Engineer &#183; ML Practitioner &#183; Future IT Project Manager
  </text>

  <!-- circuit baseline with a traveling data pulse -->
  <path id="circuitLine" d="M120,178 H1080" stroke="#1E3A5F" stroke-width="2" opacity="0.7"/>
  <circle r="4.5" fill="#38BDF8" filter="url(#glow)">
    <animateMotion dur="4.5s" repeatCount="indefinite" path="M120,178 H1080"/>
    <animate attributeName="opacity" values="0.2;1;0.2" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  <circle r="4.5" fill="#38BDF8" filter="url(#glow)">
    <animateMotion dur="4.5s" begin="2.25s" repeatCount="indefinite" path="M120,178 H1080"/>
    <animate attributeName="opacity" values="0.2;1;0.2" dur="4.5s" begin="2.25s" repeatCount="indefinite"/>
  </circle>

  <!-- corner ticks for a HUD / futuristic frame feel -->
  <g stroke="#38BDF8" stroke-width="2" opacity="0.5">
    <path d="M20,20 H50 M20,20 V50"/>
    <path d="M1180,20 H1150 M1180,20 V50"/>
    <path d="M20,220 H50 M20,220 V190"/>
    <path d="M1180,220 H1150 M1180,220 V190"/>
  </g>
</svg>
