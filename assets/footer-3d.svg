<svg width="1200" height="170" viewBox="0 0 1200 170" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGradF" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="45%" stop-color="#1E3A5F"/>
      <stop offset="100%" stop-color="#0B1220"/>
    </linearGradient>

    <linearGradient id="quoteGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94C4E8"/>
      <stop offset="50%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#94C4E8"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.6 0;0.6 0;-0.6 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>

    <filter id="glowF" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="170" fill="url(#bgGradF)"/>

  <!-- orbiting atom motif, left side -->
  <g transform="translate(150,85)">
    <circle r="6" fill="#E0F2FE" filter="url(#glowF)"/>
    <g stroke="#38BDF8" stroke-width="1.4" fill="none" opacity="0.65">
      <ellipse rx="70" ry="26">
        <animateTransform attributeName="transform" type="rotate" values="0;360" dur="14s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse rx="70" ry="26" transform="rotate(60)">
        <animateTransform attributeName="transform" type="rotate" values="60;420" dur="18s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse rx="70" ry="26" transform="rotate(120)">
        <animateTransform attributeName="transform" type="rotate" values="120;480" dur="22s" repeatCount="indefinite"/>
      </ellipse>
    </g>
    <circle r="4" fill="#38BDF8" filter="url(#glowF)">
      <animateMotion dur="14s" repeatCount="indefinite" path="M70,0 A70,26 0 1,1 -70,0 A70,26 0 1,1 70,0"/>
    </circle>
    <circle r="4" fill="#0EA5E9" filter="url(#glowF)">
      <animateMotion dur="18s" repeatCount="indefinite" path="M35,60.6 A70,26 0 1,1 -35,-60.6 A70,26 0 1,1 35,60.6" rotate="auto"/>
    </circle>
  </g>

  <!-- floating symbols, right side -->
  <g font-family="Georgia, 'Cambria Math', serif" fill="#E0F2FE">
    <text x="1010" y="45" font-size="30" opacity="0.28" filter="url(#glowF)">&#8721;
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-10; 0,0" dur="7s" repeatCount="indefinite"/>
    </text>
    <text x="1080" y="70" font-size="24" opacity="0.22" filter="url(#glowF)">&#8734;
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,8; 0,0" dur="8s" begin="1s" repeatCount="indefinite"/>
    </text>
    <text x="1130" y="45" font-size="26" opacity="0.24" filter="url(#glowF)">&#960;
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-9; 0,0" dur="9s" begin="1.5s" repeatCount="indefinite"/>
    </text>
    <text x="1020" y="130" font-size="24" opacity="0.20" filter="url(#glowF)">&#8730;
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,9; 0,0" dur="7.5s" begin="0.6s" repeatCount="indefinite"/>
    </text>
    <text x="1100" y="125" font-size="22" opacity="0.20" filter="url(#glowF)">&#916;
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-8; 0,0" dur="8.5s" begin="2s" repeatCount="indefinite"/>
    </text>
    <text x="1155" y="105" font-size="20" opacity="0.18" filter="url(#glowF)">&#955;
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,8; 0,0" dur="10s" begin="0.3s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- center quote -->
  <text x="640" y="72" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-style="italic" font-size="18" fill="url(#quoteGrad)">
    "The goal is not to be the smartest person in the room.
  </text>
  <text x="640" y="98" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-style="italic" font-size="18" fill="url(#quoteGrad)">
    The goal is to make the room smarter."
  </text>

  <!-- animated baseline shimmer -->
  <rect x="320" y="118" width="640" height="2" fill="#38BDF8" opacity="0.5"/>
  <circle cx="320" cy="119" r="3.5" fill="#E0F2FE" filter="url(#glowF)">
    <animateMotion dur="5s" repeatCount="indefinite" path="M0,0 H640 H0"/>
  </circle>

  <text x="600" y="150" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#5B87AE" letter-spacing="1.5">
    THANK YOU FOR VISITING
  </text>
</svg>
